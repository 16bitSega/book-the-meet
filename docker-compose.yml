services:
  postgres:
    image: postgres:16-alpine
    container_name: book_meet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: book_meet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_meet"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book_meet_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/book_meet?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production-2026
      OFFICE_TIMEZONE: Europe/Kyiv
      NOTIFY_BEFORE_MINUTES: 10
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
